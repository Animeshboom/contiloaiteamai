# Render Blueprint: StudioTrack API (Docker), FREE plan. Database: Neon free Postgres (https://neon.tech).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo. Fill in the "sync: false" values when prompted.
# The web app is hosted on Vercel (frontend/vercel.json), which proxies /api/* to this service.
#
# Free-plan limits: the service sleeps after ~15 min without traffic (next visit waits ~1 min while it wakes),
# uploaded files are lost on each redeploy/restart, and reminders/email dispatch pause while asleep.
# To upgrade: set plan: starter and add a disk (mountPath /app/data) for persistent uploads.
services:
  - type: web
    name: studiotrack-api            # public URL: https://studiotrack-api.onrender.com (update frontend/vercel.json if it differs)
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL             # Neon connection string: postgresql://...neon.tech/neondb?sslmode=require
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_APPROVAL_SECRET
        generateValue: true
      - key: APP_BASE_URL             # your Vercel URL, e.g. https://studiotrack.vercel.app
        sync: false
      - key: CORS_ORIGINS             # JSON array with the same URL, e.g. ["https://studiotrack.vercel.app"]
        sync: false
      - key: STUDIO_TIMEZONE
        value: Asia/Kolkata
      - key: EOD_DEADLINE_HOUR
        value: "19"
      - key: EMAIL_PROVIDER
        value: mcp
      - key: GMAIL_BACKEND
        value: gmail
      - key: GMAIL_CREDENTIALS_JSON   # optional at first: emails queue until set (docs/DEPLOY_STEPS.txt part 4)
        sync: false
      - key: GMAIL_TOKEN_JSON         # optional at first: token JSON from `python -m gmail_mcp.authorize`
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: ANTHROPIC_API_KEY        # optional: AI narrative in EOD reports
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ADMIN_EMAIL              # first administrator, created on first start
        sync: false
      - key: ADMIN_PASSWORD           # min 12 chars; delete this variable after your first sign-in
        sync: false
      - key: ADMIN_NAME
        value: Studio Admin
      - key: LEAD_EMAIL               # starter Team Lead (leads TEAM_NAME)
        sync: false
      - key: LEAD_PASSWORD            # min 12 chars
        sync: false
      - key: ARTIST_EMAIL             # starter Artist (member of TEAM_NAME)
        sync: false
      - key: ARTIST_PASSWORD          # min 12 chars
        sync: false
      - key: TEAM_NAME
        value: Production Team

